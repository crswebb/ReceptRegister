name: Release Build & Deploy

on:
  push:
    branches:
      - 'release/**'
  pull_request:
    branches:
      - 'release/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip deploy (build & test only)'
        required: false
        default: 'false'

permissions:
  contents: read
  id-token: write
  pull-requests: read

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'ReceptRegister.Frontend/ReceptRegister.Frontend.csproj'
  PUBLISH_DIR: 'publish'
  BUILD_CONFIG: 'Release'

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} -c $BUILD_CONFIG --no-restore

      - name: Test
        run: dotnet test ReceptRegister.Tests/ReceptRegister.Tests.csproj -c $BUILD_CONFIG --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish
        # Publish only for push events (release branch) or manual dispatch when not a dry_run.
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true') }}
        run: |
          echo "Publishing self-contained linux-x64 (App Service lacks preview shared runtime)"
          dotnet publish ${{ env.PROJECT_PATH }} -c $BUILD_CONFIG -r linux-x64 --self-contained true -o $PUBLISH_DIR /p:PublishSingleFile=false

      - name: Publish Diagnostics
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true') }}
        run: |
          echo "Listing publish output:";
          find $PUBLISH_DIR -maxdepth 1 -type f -printf '%f\n' | sort | head -n 40;
          echo "dotnet --info (build runner):";
          dotnet --info

      - name: Runtimeconfig guard
        id: runtimeconfig_guard
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true') }}
        run: |
          set -e
          COUNT=$(find $PUBLISH_DIR -maxdepth 1 -name '*.runtimeconfig.json' | wc -l)
          echo "runtimeconfig.json file count: $COUNT"
          if [ "$COUNT" -ne 1 ]; then
            echo "Expected exactly 1 *.runtimeconfig.json in publish output; found $COUNT" >&2
            echo "Files found:" >&2
            find $PUBLISH_DIR -name '*.runtimeconfig.json' -print >&2 || true
            exit 1
          fi
          echo "Runtimeconfig guard passed."

      - name: Upload Artifact
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: release-drop
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    name: Deploy
    needs: [build-test]
    if: ${{ github.event_name == 'push' && github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    # GitHub Environment enables a single federated credential (subject: repo:crswebb/ReceptRegister:environment:ReceptRegister)
    environment:
      name: ReceptRegister
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: release-drop
          path: ${{ env.PUBLISH_DIR }}

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: ${{ env.PUBLISH_DIR }}
          clean: true

      - name: Smoke Test
        run: |
          set -e
          BASE="https://${{ secrets.AZURE_WEBAPP_HOST }}"
          PATHS="/api/health /health"
          echo "Probing health endpoints ($PATHS) at $BASE";
          for i in {1..5}; do
            for P in $PATHS; do
              URL="$BASE$P"
              STATUS=$(curl -sk -o /dev/null -w '%{http_code}' "$URL" || true)
              echo "Attempt $i $P -> $STATUS"
              if [ "$STATUS" = "200" ]; then echo "Health OK via $P"; exit 0; fi
            done
            sleep 5;
          done
          echo "Health check failed (paths tried: $PATHS)"; exit 1

      - name: Summary
        run: |
          echo "### Release Deployment" >> $GITHUB_STEP_SUMMARY
          echo "Branch: $GITHUB_REF" >> $GITHUB_STEP_SUMMARY
          echo "App: ${{ secrets.AZURE_WEBAPP_NAME }}" >> $GITHUB_STEP_SUMMARY
